syntax = "proto3";

package task.v1;

option go_package = "github.com/ssrjkk/raven/services/proto/task/v1;taskv1";

service TaskService {
  rpc PlanTask(PlanTaskRequest) returns (PlanTaskResponse);
  rpc ExecuteTask(ExecuteTaskRequest) returns (stream ExecuteTaskResponse);
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
  rpc ListUserTasks(ListUserTasksRequest) returns (ListUserTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

message TaskStep {
  int32 order = 1;
  string description = 2;
  string tool = 3;
  string input = 4;
  string status = 5;
  string result = 6;
  string error = 7;
}

message Task {
  string id = 1;
  string user_id = 2;
  string channel = 3;
  string goal = 4;
  string status = 5;
  repeated TaskStep steps = 6;
  string error = 7;
  double created_at = 8;
  double finished_at = 9;
}

message PlanTaskRequest {
  string goal = 1;
  string user_id = 2;
  string channel = 3;
  string idempotency_key = 4;
}

message PlanTaskResponse {
  Task task = 1;
}

message ExecuteTaskRequest {
  string task_id = 1;
}

message ExecuteTaskResponse {
  oneof event {
    StepUpdate step = 1;
    TaskComplete complete = 2;
    TaskError error = 3;
  }
}

message StepUpdate {
  int32 order = 1;
  string description = 2;
  string status = 3;
  string result = 4;
}

message TaskComplete {
  string task_id = 1;
  string status = 2;
  string summary = 3;
}

message TaskError {
  string task_id = 1;
  string error = 2;
}

message GetTaskStatusRequest {
  string task_id = 1;
}

message GetTaskStatusResponse {
  Task task = 1;
}

message ListUserTasksRequest {
  string user_id = 1;
  int32 limit = 2;
  string status_filter = 3;
}

message ListUserTasksResponse {
  repeated Task tasks = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  bool ok = 1;
}
