version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_VERSION_SUFFIX
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE
    - WIRE_JSON
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
