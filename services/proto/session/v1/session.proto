syntax = "proto3";

package session.v1;

option go_package = "github.com/ssrjkk/raven/services/proto/session/v1;sessionv1";

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc CompactSession(CompactSessionRequest) returns (CompactSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListUserSessions(ListUserSessionsRequest) returns (ListUserSessionsResponse);
}

message CreateSessionRequest {
  string channel = 1;
  string user_id = 2;
  string idempotency_key = 3;
}

message CreateSessionResponse {
  string session_id = 1;
  bool created = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  string session_id = 1;
  string channel = 2;
  string user_id = 3;
  bool active = 4;
  int32 message_count = 5;
  double created_at = 6;
}

message CompactSessionRequest {
  string session_id = 1;
}

message CompactSessionResponse {
  bool ok = 1;
  string summary = 2;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {
  bool ok = 1;
}

message ListUserSessionsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ListUserSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message SessionInfo {
  string session_id = 1;
  string channel = 2;
  bool active = 3;
  int32 message_count = 4;
  double created_at = 5;
}
