syntax = "proto3";

package monitor.v1;

option go_package = "github.com/ssrjkk/raven/services/proto/monitor/v1;monitorv1";

service MonitorService {
  rpc CreateMonitor(CreateMonitorRequest) returns (CreateMonitorResponse);
  rpc GetMonitor(GetMonitorRequest) returns (GetMonitorResponse);
  rpc UpdateMonitor(UpdateMonitorRequest) returns (UpdateMonitorResponse);
  rpc DeleteMonitor(DeleteMonitorRequest) returns (DeleteMonitorResponse);
  rpc ListMonitorsByUser(ListMonitorsByUserRequest) returns (ListMonitorsByUserResponse);
  rpc GetMonitorStatus(GetMonitorStatusRequest) returns (GetMonitorStatusResponse);
}

message Monitor {
  string id = 1;
  string name = 2;
  string type = 3;
  string target = 4;
  int32 interval_seconds = 5;
  string status = 6;
  string user_id = 7;
  string channel = 8;
  string last_status = 9;
  string last_checked_at = 10;
}

message CreateMonitorRequest {
  string name = 1;
  string type = 2;
  string target = 3;
  int32 interval_seconds = 4;
  string user_id = 5;
  string channel = 6;
  string idempotency_key = 7;
}

message CreateMonitorResponse {
  Monitor monitor = 1;
}

message GetMonitorRequest {
  string monitor_id = 1;
}

message GetMonitorResponse {
  Monitor monitor = 1;
}

message UpdateMonitorRequest {
  string monitor_id = 1;
  string name = 2;
  int32 interval_seconds = 3;
}

message UpdateMonitorResponse {
  Monitor monitor = 1;
}

message DeleteMonitorRequest {
  string monitor_id = 1;
}

message DeleteMonitorResponse {
  bool ok = 1;
}

message ListMonitorsByUserRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ListMonitorsByUserResponse {
  repeated Monitor monitors = 1;
}

message GetMonitorStatusRequest {
  string monitor_id = 1;
}

message GetMonitorStatusResponse {
  string status = 1;
  string last_check = 2;
  bool up = 3;
}
