syntax = "proto3";

package rag.v1;

option go_package = "github.com/ssrjkk/raven/services/proto/rag/v1;ragv1";

service RAGService {
  rpc StoreDocument(StoreDocumentRequest) returns (StoreDocumentResponse);
  rpc SearchSimilar(SearchSimilarRequest) returns (SearchSimilarResponse);
  rpc GetConversationContext(GetConversationContextRequest) returns (GetConversationContextResponse);
  rpc StoreMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}

message Document {
  string id = 1;
  string content = 2;
  string source = 3;
  map<string, string> metadata = 4;
}

message Chunk {
  string id = 1;
  string document_id = 2;
  string content = 3;
  float score = 4;
  map<string, string> metadata = 5;
}

message StoreDocumentRequest {
  Document document = 1;
  string idempotency_key = 2;
}

message StoreDocumentResponse {
  string document_id = 1;
  int32 chunk_count = 2;
}

message SearchSimilarRequest {
  string query = 1;
  int32 k = 2;
  map<string, string> filter = 3;
}

message SearchSimilarResponse {
  repeated Chunk chunks = 1;
  float query_time_ms = 2;
}

message GetConversationContextRequest {
  string session_id = 1;
  int32 limit = 2;
}

message ContextMessage {
  string role = 1;
  string content = 2;
  float timestamp = 3;
}

message GetConversationContextResponse {
  repeated ContextMessage messages = 1;
}

message StoreMemoryRequest {
  string session_id = 1;
  string role = 2;
  string content = 3;
}

message StoreMemoryResponse {
  bool ok = 1;
}

message DeleteDocumentRequest {
  string document_id = 1;
}

message DeleteDocumentResponse {
  bool ok = 1;
}
