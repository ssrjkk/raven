syntax = "proto3";

package agent.v1;

option go_package = "github.com/ssrjkk/raven/services/proto/agent/v1;agentv1";

service AgentService {
  rpc ProcessMessage(stream ProcessMessageRequest) returns (stream ProcessMessageResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
}

service AgentRegistryService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
}

message ProcessMessageRequest {
  string session_id = 1;
  string user_id = 2;
  string channel = 3;
  string text = 4;
  repeated ContextMessage context = 5;
}

message ContextMessage {
  string role = 1;
  string content = 2;
}

message ProcessMessageResponse {
  oneof stream_event {
    TokenChunk token = 1;
    ResponseComplete complete = 2;
    ResponseError error = 3;
  }
}

message TokenChunk {
  string text = 1;
}

message ResponseComplete {
  string full_text = 1;
  string model = 2;
  string provider = 3;
  int32 tokens_used = 4;
}

message ResponseError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message CreateAgentRequest {
  string session_id = 1;
  string user_id = 2;
  string channel = 3;
}

message CreateAgentResponse {
  string agent_id = 1;
  bool ok = 2;
}

message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {
  bool ok = 1;
}

message ListAgentsRequest {
  string user_id = 1;
}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message AgentInfo {
  string agent_id = 1;
  string session_id = 2;
  string user_id = 3;
  string channel = 4;
  string status = 5;
}

message GetAgentRequest {
  string agent_id = 1;
}

message GetAgentResponse {
  AgentInfo agent = 1;
}
