[project]
name = "raven-agent"
version = "0.4.8"
description = "Raven — 2-in-1 AI platform: RavenCode (autonomous coding agent) + RavenFlow (persistent workflow gateway)"
authors = [
    { name = "ssrjkk", email = "ssrjkk@raven.ai" },
]
maintainers = [
    { name = "ssrjkk", email = "ssrjkk@raven.ai" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.162.0,<1.0",
    # Security floors: advisories patched in these versions (pip-audit clean-rooms)
    "starlette>=1.10.0,<2.0",
    "anyio>=4.14.2,<5.0",
    # CVE-2026-97687/-97688/-97689 закрыты только в 2.8.0; urllib3 приходит
    # транзитивно через sentry-sdk, поэтому нижняя граница задана здесь.
    "urllib3>=2.8.0,<3.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "httpx>=0.28.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "pydantic>=2.14.1,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "typing-extensions>=4.16.0,<5.0",
    "jsonschema>=4.26.0,<5.0",
    "loguru>=0.7.3,<1.0",
    "apscheduler>=3.10,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "soupsieve>=2.9.0",  # security floor (bs4 runtime dep)
    "lxml>=6.1.0,<7.0",
    "feedparser>=6.0.14,<7.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<16.0",
    "python-telegram-bot>=21.0,<23.0",
    "python-dotenv>=1.2.4,<2.0",
    "numpy>=1.26,<3.0",
    "PyYAML>=6.0.3,<7.0",
    "uvloop>=0.19.0,<1.0; sys_platform != 'win32'",
    "orjson>=3.13.0,<4.0",
    # 35 адварий на 12.3.0 (GHSA-78g4-xqwv-q3g8, CVE-2026-96636..96644, CVE-2026-112390..112901),
    # все закрыты только в 13.0.0: потолок <13.0 запрещал пропатченную версию и вешал Pip audit в CI.
    "Pillow>=13.0.0,<14.0",
    "pypdf>=6.1.0,<7.0",
    "python-docx>=1.1.0,<2.0",
    "python-pptx>=1.0.2,<2.0",
    "openpyxl>=3.1.0,<4.0",
    "aiofiles>=23.0,<25.0",
    "prometheus-client>=0.19,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
slack = ["slack-sdk>=3.27"]
email = ["aiosmtplib>=2.0,<6.0", "aioimaplib>=2.0.3,<3.0"]
docker = ["docker>=7.0"]
secrets = ["cryptography>=50.0.2"]  # security floor: PYSEC-2026-3552 is only patched in 50.0.0
service-win = ["pywin32>=312"]
tui = ["textual>=1.0"]
tracing = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.45.2"]
numba = ["numba>=0.60,<1.0"]
voice = ["sounddevice>=0.5.6"]
browser = ["playwright>=1.44,<2.0"]
vector = ["chromadb>=0.5.0,<2.0", "hnswlib>=0.8,<1.0"]
# Providers the code imports lazily and falls back from silently. They belong here because an
# optional import that is named nowhere is how the voice anti-spoof check stopped checking and
# stayed green: nothing failed, a control just stopped existing.
tts = ["elevenlabs>=1.11,<2.0", "gTTS>=2.5,<3.0", "edge-tts>=7.0,<8.0"]
stt = [
    "vosk>=0.3.45,<0.4",
    "SpeechRecognition>=3.10,<4.0",
    "openai-whisper>=20240930",
    "azure-cognitiveservices-speech>=1.40,<2.0",
]
speaker = ["librosa>=0.10,<2.0", "speechbrain>=1.0,<2.0"]
search = ["duckduckgo-search>=6.1,<9.0"]
nlp = ["presidio-analyzer>=2.2,<3.0"]
logging = ["structlog>=24.1,<27.0"]
tracking = ["wandb>=0.17,<1.0"]
rag = ["sentence-transformers>=3.0,<4.0"]
ml = [
    "torch>=2.0,<3.0",
    # the floor is the version the smoke test in tests/ml actually runs against: fine_tuning.py
    # passes dtype=, processing_class= and eval_strategy=, and the two older spellings
    # (torch_dtype=, tokenizer=) plus evaluation_strategy= are gone from this API
    "transformers>=4.57,<5.0",
    "peft>=0.10,<1.0",
    "datasets>=2.20,<3.0",
]
ner = ["spacy>=3.8.18,<4.0"]
postgres = ["asyncpg>=0.29"]
crdt = ["y-py>=0.6.2,<1.0"]
profiling = ["py-spy>=0.4.2,<1.0"]
chaos = ["psutil>=7.2.2,<8.0"]
metrics = ["prometheus-client>=0.19,<1.0"]
redis = ["redis>=5.0,<6.0"]
dev = [
    # 9.0.3 carries the PYSEC-2026-1845 fix; 9.2 drops Function._nodeid,
    # which pytest-benchmark 5.x still reads
    "pytest>=9.0.3,<9.2",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-timeout>=2.3,<4.0",
    "pytest-github-actions-annotate-failures>=0.2,<1.0",
    "pytest-benchmark>=5.3.1,<6.0",
    "allure-pytest>=2.16.2,<3.0",
    "coverage>=7.17.0,<8.0",
    # >=50.0.0 is the first release with no open advisories (pip-audit clean); the old
    # <45.0 cap pinned a version with 10 known vulnerabilities
    "cryptography>=50.0.2,<51.0",
    # The gate runs `ruff format --check` over the tree and strict mypy over it, so the tool version
    # is part of the control rather than a preference: a wide range lets a fresh install resolve a
    # formatter that disagrees with the tree the committed one produced. 0.17.2 formatted it and 0.17.4
    # -- what CI installs -- reports 925 files already formatted, so ~=0.17.4 admits the next patch
    # without letting the layout answer change underneath the gate.
    "ruff~=0.17.4",
    "mypy~=2.4.1",
    # scripts/check_all.py runs it as the security-lint stage; the gate fails on High and Medium
    "bandit>=1.7.10,<2.0",
    "pre-commit>=4.7.0,<5.0",
    "testcontainers[redis]>=4.0.0,<4.15.0",
    "textual>=1.0,<9.0",
    "playwright>=1.44,<2.0",
]
media = ["ffmpeg-python>=0.2.0,<1.0"]
re = ["capstone>=5.0.9,<6.0", "pyelftools>=0.33,<1.0", "pefile>=2023,<2024"]
all = ["raven-agent[discord,slack,email,docker,secrets,service-win,tui,tracing,voice,tts,search,logging,dev,browser,vector,numba,crdt,profiling,chaos,postgres,media]"]
# Deliberately outside `all`, like `ml`: these pull torch, spacy or vendor SDK wheels.
# stt, speaker, nlp, tracking.

[project.scripts]
raven = "raven.cli.main:cli"
ravencode = "ravencode.cli.main:cli"
ravenflow = "raven.gateway.daemon:main"
raven-mcp = "raven.core.mcp.__main__:main"
ravencode-mcp = "ravencode.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven", "aios", "ravencode"]

# CI stages the prebuilt React SPA at `raven/web/dist` (see .github/workflows/pypi.yml),
# which ships inside the package when present — resolved at runtime by
# `raven.core.spa.resolve_web_dist`. `artifacts` only bypasses the `dist/` gitignore rule,
# so wheel builds still succeed when the SPA was not built.
artifacts = ["raven/web/dist/**"]

# The tool ruleset travels the same way: `policy/tools.json` is the deny list the evaluator
# enforces, so a wheel (Docker, `pipx install raven-agent`) that left it in the repository would
# install a Raven whose shipped policy is decoration. `raven.core.security.policy_engine` looks for
# `policy/` next to the source tree first and for this packaged copy after that. Only the ruleset
# travels: `policy/openclaw_compat.yaml` is a config template, not a ruleset, and nothing loads it.
[tool.hatch.build.targets.wheel.force-include]
"policy/tools.json" = "raven/policy/tools.json"

[tool.hatch.build.targets.sdist]
artifacts = ["raven/web/dist/**"]

[tool.mypy]
strict = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
exclude = ['deploy/', 'build/', '\.git/', 'extension/', 'scripts/']

# Optional dependency stubs
[[tool.mypy.overrides]]
module = [
    'raven.channels.discord.channel',
    'raven.unique.fine_tuning',
    'raven.unique.voice_biometrics',
    'raven.core.metrics',
]
ignore_errors = true

# Written against the pact-python 1.x API that 2.x+ removed; which names mypy can see
# depends on the installed pact-python, so the file is skipped rather than ignored inline.
[[tool.mypy.overrides]]
module = 'tests.contract.test_pacts'
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
    --alluredir=allure-results
    --cov=raven
    --cov=aios
    --cov=ravencode
    --cov-report=term-missing
    --cov-report=xml
    --tb=short
    --no-header
"""
asyncio_mode = "auto"
log_cli_level = "WARNING"
markers = [
    "pact: Pact contract tests (provider-specific)",
    "load: k6 load test wrapper",
    "slow: tests that take >5s",
    "unit: Fast unit tests with no external dependencies",
    "integration: Tests requiring DB, NATS, or external services",
    "e2e: Full end-to-end tests",
    "eval: Evaluation / benchmark tests",
    "async: Coroutine-based async tests",
    "security: Security-oriented tests",
    "rag: RAG/embedding pipeline tests",
    "agent: Agent FSM tests",
    "smoke: Quick smoke/sanity tests",
    "ml: Fine-tuning smoke tests, need torch/transformers/peft/datasets and RAVEN_ML_SMOKE=1",
]



[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".pre-commit-config.yaml"]

[tool.ruff.lint]
select = ["ASYNC100", "E", "F", "W", "I", "N", "UP", "B", "SIM", "S", "BLE", "TRY", "RET", "PERF", "RUF", "PTH"]
ignore = ["E501", "SIM108", "S101", "S104", "S102", "S106", "S311", "S603", "S607", "S608", "S307", "BLE001", "TRY300", "TRY003", "TRY301", "PERF401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["F401", "ANN", "S101", "S102", "S105", "S106", "S108", "S603", "S604", "S607", "B017", "N801", "N802", "N806", "F841", "SIM117"]
"*__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
