[project]
name = "raven-agent"
version = "0.4.0"
description = "Enterprise-grade personal AI assistant — Telegram-first, 12 channels, multi-provider LLM, circuit breakers, audit, admin API"
authors = [
    { name = "ssrjkk" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "loguru>=0.7.3",
    "apscheduler>=3.10",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "python-telegram-bot>=21.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
slack = ["slack-sdk>=3.27"]
docker = ["docker>=7.0"]
secrets = ["cryptography>=41.0"]
service-win = ["pywin32>=306"]
tui = ["textual>=1.0"]
tracing = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
all = ["raven-agent[discord,slack,docker,secrets,service-win,tui,tracing,dev]"]

[project.scripts]
raven = "raven.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven", "aios", "ravencode"]

[tool.mypy]
strict = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
ignore_missing_imports = true
exclude = ['services/', 'daemon/', 'deploy/', 'build/', '\.git/', 'extension/', 'scripts/']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
