[project]
name = "raven-agent"
version = "0.4.0"
description = "Enterprise-grade personal AI assistant — Telegram-first, 12 channels, multi-provider LLM, circuit breakers, audit, admin API"
authors = [
    { name = "ssrjkk" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "httpx>=0.28.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "loguru>=0.7.3,<1.0",
    "apscheduler>=3.10,<4.0",
    "playwright>=1.44,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<6.0",
    "feedparser>=6.0,<7.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
    "python-telegram-bot>=21.0,<22.0",
    "chromadb>=0.5.0,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
slack = ["slack-sdk>=3.27"]
docker = ["docker>=7.0"]
secrets = ["cryptography>=41.0"]
service-win = ["pywin32>=306"]
tui = ["textual>=1.0"]
tracing = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.0,<5.0",
]
all = ["raven-agent[discord,slack,docker,secrets,service-win,tui,tracing,dev]"]

[project.scripts]
raven = "raven.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven", "aios", "ravencode"]

[tool.mypy]
strict = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
exclude = ['services/', 'daemon/', 'deploy/', 'build/', '\.git/', 'extension/', 'scripts/', 'tests/']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --no-header --alluredir=allure-results"
asyncio_mode = "auto"
log_cli_level = "WARNING"
markers = [
    "pact: Pact contract tests (provider-specific)",
    "load: k6 load test wrapper",
    "slow: tests that take >5s",
    "unit: Fast unit tests with no external dependencies",
    "integration: Tests requiring DB, NATS, or external services",
    "e2e: Full end-to-end tests",
    "async: Coroutine-based async tests",
    "security: Security-oriented tests",
    "rag: RAG/embedding pipeline tests",
    "agent: Agent FSM tests",
    "smoke: Quick smoke/sanity tests",
]



[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S"]
ignore = ["E501", "SIM108", "S101", "S104", "S110", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "ANN", "S101", "S102"]
"*__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
