# NATS JetStream Configuration
# Path: deploy/nats/nats.conf

port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 10GB

  # ── Stream Definitions ─────────────────────────────────────
  # All streams use max_msgs_per_subject for dedup window

  # Inbound messages from channels to agent-core
  stream: [
    {
      name: "messages-inbound"
      subjects: ["messages.inbound.>"]
      retention: limits
      max_consumers: 10
      max_msgs_per_subject: 1
      max_age: 24h
      storage: file
      replicas: 1
      discard: old
      duplicate_window: 30s
    }
    {
      name: "agent-responses"
      subjects: ["agent.responses.>"]
      retention: limits
      max_consumers: 10
      max_msgs_per_subject: 1
      max_age: 1h
      storage: file
      discard: old
      duplicate_window: 30s
    }
    {
      name: "monitor-alerts"
      subjects: ["monitor.alerts.>"]
      retention: limits
      max_consumers: 10
      max_msgs_per_subject: 100
      max_age: 72h
      storage: file
      discard: old
    }
    {
      name: "events-domain"
      subjects: ["events.>"]
      retention: limits
      max_consumers: 50
      max_msgs_per_subject: 10
      max_age: 168h
      storage: file
      discard: old
    }
    {
      name: "audit-log"
      subjects: ["audit.>"]
      retention: limits
      max_consumers: 5
      max_age: 720h
      storage: file
      discard: old
    }
  ]

  # ── Consumer Definitions ────────────────────────────────────
  consumer: [
    {
      name: "gateway-agent-worker"
      stream_name: "messages-inbound"
      deliver_subject: "_inbox.gateway.agent.worker"
      deliver_group: "agent-core-workers"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 5
      replay_policy: instant
      max_ack_pending: 100
    }
    {
      name: "agent-gateway-feedback"
      stream_name: "agent-responses"
      deliver_subject: "_inbox.agent.gateway.feedback"
      deliver_group: "gateway-feedback"
      ack_policy: explicit
      ack_wait: 10s
      max_deliver: 3
      replay_policy: instant
    }
    {
      name: "monitor-alert-handler"
      stream_name: "monitor-alerts"
      deliver_subject: "_inbox.monitor.alert.handler"
      deliver_group: "alert-consumers"
      ack_policy: explicit
      ack_wait: 10s
      max_deliver: 5
      replay_policy: instant
      max_ack_pending: 50
    }
  ]
}

# Authorization — service accounts
authorization {
  token: ""  # set via NATS_TOKEN env var in production

  # Service-level permissions
  default_permissions {
    publish: ["_INBOX.>", "health.>"]
    subscribe: ["_INBOX.>", "health.>"]
  }
}
