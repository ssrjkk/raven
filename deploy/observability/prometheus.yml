global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: "raven"
    metrics_path: /api/metrics/prometheus
    static_configs:
      - targets: ["raven:18888"]
        labels:
          service: raven
