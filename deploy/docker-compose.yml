services:
  raven:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - RAVEN_VERSION=${RAVEN_VERSION:-0.4.0}
    env_file:
      - ../.env
    volumes:
      - raven_data:/app/data
      - raven_workspace:/app/workspace
    ports:
      - target: 18888
        published: 18888
        protocol: tcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "raven", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/raven.db
      - LOG_FILE=/app/data/raven.log
      - WORKSPACE_PATH=/app/workspace
      - TZ=${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=100M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          memory: ${RAVEN_MEM_LIMIT:-2g}
          cpus: ${RAVEN_CPU_LIMIT:-2}
        reservations:
          memory: ${RAVEN_MEM_RESERVE:-512m}
          cpus: ${RAVEN_CPU_RESERVE:-0.5}
    networks:
      - raven_internal

networks:
  raven_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  raven_data:
    driver: local
  raven_workspace:
    driver: local
