# Traefik Dynamic Configuration
# Path: deploy/traefik/dynamic.yml
# Injected via docker-compose as a volume mount
#
# Raven is a monolith serving both the API and the SPA on :18888, so a single
# router/backend is enough. Security middlewares (rate-limit, CORS,
# security-headers, correlation-id, compression, retry, circuit-breaker) are
# preserved from the microservices era.

http:
  middlewares:
    # ── Security Middlewares ──────────────────────────────────
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m
        sourceCriterion:
          requestHeader:
            pattern: "X-Forwarded-For"
            name: "X-Forwarded-For"

    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:3000"
          - "https://raven.local"
        accessControlMaxAge: 86400
        accessControlAllowCredentials: true
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Idempotency-Key"
          - "X-Correlation-Id"

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    # ── Correlation ID injection ──────────────────────────────
    correlation-id:
      headers:
        customRequestHeaders:
          X-Correlation-Id: "{{ .Req.Header.Get \"X-Correlation-Id\" | default (uuid) }}"

    compression:
      compress:
        excludedContentTypes:
          - "text/event-stream"
          - "application/octet-stream"

    # ── Retry / Timeout ──────────────────────────────────────
    retry:
      retry:
        attempts: 3
        initialInterval: 500ms

    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.1 || LatencyAtQuantileMS(50.0) > 1000"
        checkPeriod: 10s
        fallbackDuration: 30s
        recoveryDuration: 10s

    # ── Combined chain ───────────────────────────────────────
    chain-public:
      chain:
        middlewares:
          - rate-limit
          - cors
          - security-headers
          - correlation-id
          - compression

  routers:
    raven-router:
      rule: "Host(`api.raven.local`)"
      entryPoints:
        - web
      middlewares:
        - chain-public
      service: raven-service

  services:
    raven-service:
      loadBalancer:
        servers:
          - url: "http://raven:18888"
        passHostHeader: true
        healthCheck:
          path: "/api/health/live"
          interval: "15s"
          timeout: "3s"