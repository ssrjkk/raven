site_name: Raven AI
site_url: https://ssrjkk.github.io/raven
site_description: Personal AI Assistant — Any Channel. Any Platform.
repo_url: https://github.com/ssrjkk/raven
repo_name: ssrjkk/raven

theme:
  name: material
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Channels:
    - Overview: channels/overview.md
  - Core Concepts:
    - Architecture: concepts/architecture.md
  - Configuration: configuration.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
