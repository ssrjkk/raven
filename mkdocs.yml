site_name: Raven AI
site_author: ssrjkk
copyright: Copyright &copy; 2026 by <a href="https://github.com/ssrjkk">ssrjkk</a>
site_url: https://ssrjkk.github.io/raven/docs/
site_description: Personal AI Assistant — Any Channel. Any Platform.
repo_url: https://github.com/ssrjkk/raven
repo_name: ssrjkk/raven

# The default is site/, which is the tracked landing directory: building docs there
# overwrites index.html and the published site stops being the landing page.
site_dir: build/docs

theme:
  name: material
  # Material loads Roboto from Google Fonts unless told otherwise, which hands every visitor's
  # IP address to another host. The product advertises a server you run yourself; the
  # documentation has to hold that line too, so the theme's font fetch is off and the pages
  # fall back to the reader's own system face.
  font: false
  # No palette: key. Material's public build resolves only its own named schemes there — a hex
  # is written to the page as a data attribute with no matching rule, and the theme falls back
  # to its default indigo. The brand colors are set in stylesheets/brand.css instead.
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

# Top level, not under `theme:`: the stylesheet links are built from `config.extra_css`, and a
# key inside `theme:` reaches only a legacy template global Material ignores — so the file copied
# into the output but no page linked it.
extra_css:
  - stylesheets/brand.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Channels:
    - Overview: channels/overview.md
  - Core Concepts:
    - Architecture: concepts/architecture.md
  - Configuration: configuration.md
  - MCP: mcp.md
  - CLI: cli.md
  - Plugins: plugins.md
  - Security: security/overview.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
