repos:
  - repo: local
    hooks:
      - id: generate-deploy-id
        name: Generate deploy watermark
        entry: python scripts/generate_deploy_id.py
        language: system
        always_run: true
        pass_filenames: false
        description: "Bakes a unique git-based deploy ID into raven/core/_deploy.py"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
