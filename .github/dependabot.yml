version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The OpenTelemetry stack moves as one: instrumentation/exporter 0.300 is
      # built against sdk 3 while sdk-trace-web/resources are still 2.x, so a
      # single-package bump breaks the web build. Patches still come through.
      - dependency-name: "@opentelemetry/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "npm"
    directory: "/extension/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "extension"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # node:25 is not an LTS line; the image and the CI runners stay on the
      # 22 LTS track (supported to April 2027). An LTS move is a deliberate
      # commit across Dockerfile and workflows, not a bot bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

