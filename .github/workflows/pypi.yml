name: PyPI

# Publish only when asked. The `release: published` trigger used to live here, and its
# `if: ${{ !inputs.dry_run }}` guard was always true for it: `inputs` is populated only for
# workflow_dispatch, so on a release event the condition read `!null`. v0.4.1 and v0.4.2 both
# reached the real `Publish to PyPI` step that way and died on
# "Trusted publishing exchange failure" -- a red run on every release, and one misconfigured
# secret away from an irreversible upload.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish to TestPyPI instead)"
        type: boolean
        default: true

permissions:
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Download web dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: raven/web/dist
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI (dry run)
        if: ${{ inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/