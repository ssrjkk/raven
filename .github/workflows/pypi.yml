name: PyPI

# Publish only when asked. The `release: published` trigger used to live here, and its
# `if: ${{ !inputs.dry_run }}` guard was always true for it: `inputs` is populated only for
# workflow_dispatch, so on a release event the condition read `!null`. v0.4.1 and v0.4.2 both
# reached the real `Publish to PyPI` step that way and died on
# "Trusted publishing exchange failure" -- a red run on every release, and one misconfigured
# secret away from an irreversible upload.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish to TestPyPI instead)"
        type: boolean
        default: true

permissions:
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Download web dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: raven/web/dist
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - name: Publish to TestPyPI (dry run)
        if: ${{ inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/