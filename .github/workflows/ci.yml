name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: "1.8.3"
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip ruff mypy
          pip install -r monolith-requirements.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: MyPy typecheck
        run: mypy --strict --ignore-missing-imports raven/ services/
        continue-on-error: true

  test-monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio pytest-cov
          pip install -r monolith-requirements.txt

      - name: Run tests
        run: pytest tests/ --cov=raven --cov-report=xml --cov-report=term -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        service:
          - gateway
          - auth
          - agent-core
          - monitor-engine
          - rag-service
          - task-engine
          - code-service
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nats-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NATS
        run: |
          docker compose -f deploy/docker-compose.nats.yml up -d
          sleep 5

      - name: Verify streams
        run: |
          pip install nats-py
          python deploy/nats/nats-stream-manager.py verify

      - name: Cleanup
        run: docker compose -f deploy/docker-compose.nats.yml down
