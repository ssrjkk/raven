name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Test with pytest
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Check import consistency
        run: |
          python -c "from raven.core.config import Settings; from raven.core.gateway.gateway import Gateway; print('Imports OK')"

      - name: Verify raven.spec hidden imports exist
        run: |
          python -c "
          imports = [
              'raven.core.config',
              'raven.core.db',
              'raven.core.llm',
              'raven.core.agent',
              'raven.core.gateway',
              'raven.core.task_queue',
              'raven.core.plugin_loader',
              'raven.core.models',
              'raven.plugins.memory',
              'raven.plugins.browser',
              'raven.plugins.cron',
              'raven.plugins.code',
              'raven.plugins.files',
              'raven.plugins.api',
              'raven.plugins.ocr',
              'raven.plugins.process',
              'raven.plugins.sessions',
              'raven.plugins.git',
          ]
          failed = []
          for imp in imports:
              try:
                  __import__(imp)
              except ImportError as e:
                  failed.append(f'{imp}: {e}')
          if failed:
              print('MISSING IMPORTS:')
              for f in failed:
                  print(f'  {f}')
              exit(1)
          print('All spec imports verified OK')
          "

      - name: Check for Windows path antipatterns
        run: |
          ruff check raven/ --select PTH --output-format github || true
