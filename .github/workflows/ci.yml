name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.3"
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip ruff mypy
          pip install -r monolith-requirements.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: MyPy typecheck
        run: mypy --strict --ignore-missing-imports raven/ services/
        continue-on-error: true

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go mod tidy
        run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go mod tidy && cd ../..
          done

      - name: Go build
        run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go build ./... && cd ../..
          done

      - name: Go vet
        run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go vet ./... && cd ../..
          done

      - name: Show Go module versions
        run: |
          head -5 services/gateway/go.mod services/auth/go.mod services/monitor-engine/go.mod

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"

      - name: Buf lint
        working-directory: services/proto
        run: buf lint

      - name: Buf breaking
        working-directory: services/proto
        run: buf breaking --against '../../.git#branch=main' || true

  test-monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio pytest-cov
          pip install -r monolith-requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ --cov=raven --cov-report=xml --cov-report=term -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        service:
          - gateway
          - auth
          - agent-core
          - monitor-engine
          - rag-service
          - task-engine
          - code-service
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build context
        id: ctx
        run: |
          if [[ "${{ matrix.service }}" =~ ^(gateway|auth|monitor-engine)$ ]]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          dockerfile: ${{ steps.ctx.outputs.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nats-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NATS
        run: |
          docker compose -f deploy/docker-compose.nats.yml up -d
          sleep 5

      - name: Verify streams
        run: |
          pip install nats-py
          python deploy/nats/nats-stream-manager.py verify

      - name: Cleanup
        run: docker compose -f deploy/docker-compose.nats.yml down

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web
        continue-on-error: true

  k6-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start services
        run: |
          docker compose -f deploy/docker-compose.yml up -d auth gateway monitor-engine
          sleep 10

      - name: Run k6 smoke test
        run: k6 run --vus 5 --duration 30s tests/load/scenario.js
        env:
          AUTH_BASE: http://localhost:8001
          GATEWAY_BASE: http://localhost:8000
          MONITOR_BASE: http://localhost:8003
