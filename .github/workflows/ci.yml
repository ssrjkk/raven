name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: Check & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Quick checks (lint + types + imports)
        if: github.event_name == 'pull_request'
        run: python scripts/check_all.py --quick

      - name: Full checks + coverage
        if: github.event_name == 'push'
        run: python scripts/check_all.py --cov

      - name: Verify DB indexes (migration v5)
        if: github.event_name == 'push'
        run: python scripts/verify_db_indexes.py

      - name: E2E tests (on main push, py3.11 only)
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        run: python scripts/check_all.py --component e2e

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  e2e-tests:
    name: E2E tests (Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: raven
          POSTGRES_PASSWORD: raven
          POSTGRES_DB: raven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run E2E tests with Allure
        env:
          RAVEN_ENV: testing
          RAVEN_LLM_PROVIDER: mock
          DATABASE_URL: postgresql+asyncpg://raven:raven@localhost:5432/raven_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/e2e/ -v --cov-report=xml:coverage-e2e.xml --cov-fail-under=0

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Publish Allure report to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: allure-report
          keep_files: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-e2e.xml
          fail_ci_if_error: false
          verbose: true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
      - name: Pip audit
        run: |
          pip install pip-audit
          pip freeze 2>/dev/null > requirements-lock.txt || true
          pip-audit -r requirements-lock.txt || true
