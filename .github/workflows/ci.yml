name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.3"
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip ruff mypy
          pip install -r monolith-requirements.txt
          pip install -e .

      - name: Ruff lint
        run: ruff check --output-format=github .

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go mod tidy
        run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go mod tidy && cd ../..
          done

      - name: Go build
        run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go build ./... && cd ../..
          done

      - name: Go vet
        run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go vet ./... && cd ../..
          done

      - name: Show Go module versions
        run: |
          head -5 services/gateway/go.mod services/auth/go.mod services/monitor-engine/go.mod

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"

      - name: Buf lint
        working-directory: services/proto
        run: buf lint

      - name: Buf breaking
        working-directory: services/proto
        run: buf breaking --against '../../.git#branch=main' || true

  test-monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip pytest pytest-asyncio pytest-cov
          pip install -r monolith-requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ --cov=raven --cov-report=xml --cov-report=term -v

      - uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - gateway
          - auth
          - agent-core
          - monitor-engine
          - rag-service
          - task-engine
          - code-service
    steps:
      - uses: actions/checkout@v6

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set build context
        id: ctx
        run: |
          echo "context=." >> $GITHUB_OUTPUT
          echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nats-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup NATS
        run: |
          docker version
          docker compose version
          docker compose -f deploy/docker-compose.nats.yml up -d 2>&1 || true
          sleep 5
          docker ps -a
          docker compose -f deploy/docker-compose.nats.yml logs nats||true

      - name: Verify streams
        run: |
          pip install "nats-py>=2.9.0,<2.15.0"
          for i in $(seq 1 10); do
            python deploy/nats/nats-stream-manager.py verify && break
            echo "Retry $i..."
            sleep 3
          done

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.nats.yml down --volumes

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web
        continue-on-error: true

  k6-smoke:
    runs-on: ubuntu-latest
    needs: [docker-build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start services
        env:
          JWT_SECRET: ci-test-secret-key-not-for-production
        run: |
          docker version
          docker compose version
          docker compose -f docker-compose.micro.yml pull nats 2>&1 || true
          docker compose -f docker-compose.micro.yml build auth gateway monitor-engine 2>&1 || true
          docker compose -f docker-compose.micro.yml up -d auth gateway monitor-engine 2>&1 || true
          docker ps -a || true
          echo "Waiting for services (up to 2 minutes)..."
          for i in $(seq 1 24); do
            AUTH_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health 2>/dev/null || echo "000")
            GW_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
            MON_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8003/health 2>/dev/null || echo "000")
            if [ "$AUTH_OK" = "200" ] && [ "$GW_OK" = "200" ] && [ "$MON_OK" = "200" ]; then
              echo "All services healthy"
              break
            fi
            echo "Waiting... ($i/24) auth=$AUTH_OK gw=$GW_OK mon=$MON_OK"
            sleep 5
          done
          docker compose -f docker-compose.micro.yml logs --tail 20 nats auth gateway monitor-engine || true

      - name: Run k6 smoke test
        run: k6 run --vus 5 --duration 30s tests/load/scenario.js
        env:
          AUTH_BASE: http://localhost:8001
          GATEWAY_BASE: http://localhost:8000
          MONITOR_BASE: http://localhost:8003

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.micro.yml down --volumes
