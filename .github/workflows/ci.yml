name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    name: Check & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Quick checks (lint + types + imports)
        if: github.event_name == 'pull_request'
        run: python scripts/check_all.py --quick

      - name: Full checks + coverage
        if: github.event_name == 'push'
        run: python scripts/check_all.py --cov

      - name: Verify DB indexes (migration v5)
        if: github.event_name == 'push'
        run: python scripts/verify_db_indexes.py

      - name: E2E tests (on main push, py3.11 only)
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        run: python scripts/check_all.py --component e2e

  windows:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Quick checks (lint + types + imports + CLI)
        run: python scripts/check_all.py --quick

      - name: Workspace isolation + security tests
        run: pytest tests/test_tools_file.py tests/test_ravencode_core_holes.py tests/core/test_security.py -q --no-cov --timeout=120

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: raven:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # hatchling skips package directories that are absent from the build context without
      # failing, so a Dockerfile that copies only part of them ships an image that imports
      # fine for `raven` and crashes on the other entrypoints. Check the real artifact.
      - name: Verify packaged modules import
        run: |
          docker run --rm raven:smoke python -c \
            "import aios, ravencode, raven.gateway.daemon, raven.core.mcp.server"

      - name: Verify console scripts
        run: |
          docker run --rm --entrypoint sh raven:smoke -c \
            "command -v raven ravencode ravenflow"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: web
        run: npx eslint src
      - name: Frontend unit tests
        working-directory: web
        run: npm test -- --run
      - name: Build
        working-directory: web
        run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  postgres-integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raven
          POSTGRES_PASSWORD: raven
          POSTGRES_DB: raven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dependencies (with postgres extras)
        run: pip install -e ".[dev,postgres]"
      - name: Run Postgres integration tests
        env:
          DATABASE_URL: postgresql://raven:raven@localhost:5432/raven_test
        run: pytest tests/integration/ -m integration -v --tb=short --no-cov

  e2e-tests:
    name: E2E tests (Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: raven
          POSTGRES_PASSWORD: raven
          POSTGRES_DB: raven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run E2E tests
        env:
          RAVEN_ENV: testing
          RAVEN_LLM_PROVIDER: mock
          DATABASE_URL: postgresql+asyncpg://raven:raven@localhost:5432/raven_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/e2e/ -v --cov-report=xml:coverage-e2e.xml --cov-fail-under=0

      # The simple-elf/allure-report-action image build is broken upstream (issue #72),
      # and GitHub Pages is not enabled for this repo, so the report had nowhere to go.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-e2e.xml
          fail_ci_if_error: false
          verbose: true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      # --exclude-editable drops the self-install, --no-deps audits exactly that pinned set
      # rather than re-resolving it. No `|| true`: a known vulnerability fails the job.
      - name: Pip audit
        run: |
          pip freeze --exclude-editable > requirements-lock.txt
          pip install pip-audit
          python -m pip_audit --strict --no-deps -r requirements-lock.txt
