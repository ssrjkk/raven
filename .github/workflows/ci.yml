name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test raven module
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
from raven.core.config import settings
from raven.core.llm import LLMRouter
from raven.core.db import Database
from raven.core.agent.agent import Agent, AgentConfig
from raven.core.agent.registry import AgentRegistry
from raven.core.gateway.gateway import Gateway
from raven.core.task_engine.planner import TaskPlanner
from raven.core.coder.session import CodingSessionManager
from raven.core.coder.review import CodeReviewer
from raven.core.sandbox import Sandbox
from raven.core.rag.retriever import Retriever
print('raven module: OK')
"
      - name: Test aios bridge
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
from aios.api.bridge import router, AIRequest, AIResponse
from aios.agents.orchestrator import Orchestrator, AgentType
from aios.runtime.adapter import RuntimeAdapter
print('aios bridge: OK')
"
      - name: Lint
        run: |
          pip install ruff
          ruff check raven/ aios/ --quiet
