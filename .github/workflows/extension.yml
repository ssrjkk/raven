name: Extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
  pull_request:
    paths:
      - "extension/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Syntax-check popup modules
        run: |
          node --check extension/src/popup/popup.js
          node --check extension/src/popup/popup-security.js

      - name: Test popup link policy
        run: node --test extension/tests/*.test.mjs

      - name: Package extension
        working-directory: extension
        run: |
          mkdir -p dist
          cp -r manifest.json src icons dist/
          cd dist && zip -r ../raven-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: raven-extension
          path: extension/raven-extension.zip
