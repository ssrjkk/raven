name: Extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
  pull_request:
    paths:
      - "extension/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Syntax-check popup modules
        run: |
          node --check extension/src/popup/popup.js
          node --check extension/src/popup/popup-security.js

      - name: Test popup link policy
        run: node --test extension/tests/*.test.mjs

      - name: Package extension
        working-directory: extension
        run: |
          mkdir -p dist
          cp -r manifest.json src icons dist/
          cd dist && zip -r ../raven-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raven-extension
          path: extension/raven-extension.zip
