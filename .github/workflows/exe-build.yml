name: Build EXE

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    name: Build Raven.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps (with postgres extras)
        run: pip install -e ".[postgres]" pyinstaller

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Generate app icon
        run: python scripts/make_icon.py

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath packaging\dist --workpath packaging\build scripts/raven.spec

      - name: Smoke test EXE (CLI + bundled web assets)
        run: |
          $exe = Join-Path $PWD "packaging\dist\Raven.exe"
          if (-not (Test-Path $exe)) { throw "Raven.exe not found" }
          $size = (Get-Item $exe).Length
          Write-Host "Raven.exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 10MB) { throw "Raven.exe too small, build likely failed" }

          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Raven.exe --help failed" }

          $dataDir = Join-Path $env:RUNNER_TEMP "raven-exe-smoke"
          $env:RAVEN_DATA_DIR = $dataDir
          $stdout = Join-Path $env:RUNNER_TEMP "raven-exe-smoke.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "raven-exe-smoke.err.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--no-browser", "--port", "18889" -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18889/api/health" -TimeoutSec 2
                if ($health.status) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Raven gateway did not become ready"
            }

            $fontPath = Join-Path $env:RUNNER_TEMP "raven-font.woff2"
            $font = Invoke-WebRequest -Uri "http://127.0.0.1:18889/fonts/IBMPlexSans-latin.woff2" -OutFile $fontPath -UseBasicParsing
            if ($font.Headers["Content-Type"] -notlike "font/woff2*") { throw "WOFF2 MIME type is wrong: $($font.Headers['Content-Type'])" }
            $magic = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($fontPath), 0, 4)
            if ($magic -ne "wOF2") { throw "Font route returned non-font content" }

            $sw = Invoke-WebRequest -Uri "http://127.0.0.1:18889/sw.js" -UseBasicParsing
            if ($sw.Headers["Content-Type"] -notlike "text/javascript*") { throw "Service worker MIME type is wrong" }
            $manifest = Invoke-RestMethod -Uri "http://127.0.0.1:18889/manifest.json"
            if ($manifest.name -ne "Raven") { throw "Manifest route returned wrong content" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Write the SHA-256 checksum
        run: |
          $exe = Join-Path $PWD "packaging\dist\Raven.exe"
          $sum = Join-Path $PWD "packaging\dist\Raven.exe.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          # coreutils format with LF endings: the verify step below is sha256sum --check on Linux
          [IO.File]::WriteAllText($sum, "$hash  Raven.exe`n")
          "sha256 ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "sha256 $hash"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Raven-exe
          path: |
            packaging/dist/Raven.exe
            packaging/dist/Raven.exe.sha256
          retention-days: 14

  upload-release:
    name: Attach EXE to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Raven-exe
          path: packaging/dist

      - name: Verify the checksum the build produced
        working-directory: packaging/dist
        run: sha256sum --check Raven.exe.sha256

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packaging/dist/Raven.exe
            packaging/dist/Raven.exe.sha256

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            packaging/dist/Raven.exe
            packaging/dist/Raven.exe.sha256