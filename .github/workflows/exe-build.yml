name: Build EXE

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    name: Build Raven.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps (with postgres extras)
        run: pip install -e ".[postgres]" pyinstaller

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build web frontend
        working-directory: web
        run: npm run build

      - name: Generate app icon
        run: python scripts/make_icon.py

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath packaging\dist --workpath packaging\build scripts/raven.spec

      - name: Smoke test EXE (imports + helpers)
        run: |
          if (-not (Test-Path "packaging\dist\Raven.exe")) { throw "Raven.exe not found" }
          $size = (Get-Item "packaging\dist\Raven.exe").Length
          Write-Host "Raven.exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 10MB) { throw "Raven.exe too small, build likely failed" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raven-exe
          path: packaging/dist/Raven.exe
          retention-days: 14

  upload-release:
    name: Attach EXE to GitHub Release
    runs-on: ubuntu-latest
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Raven-exe
          path: packaging/dist
      - uses: softprops/action-gh-release@v3
        with:
          files: packaging/dist/Raven.exe