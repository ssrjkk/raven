name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install MkDocs
        # Pinned: an unpinned install lets a theme release change the published documentation
        # without a commit, so the artifact would not be the one reviewed here.
        run: pip install "mkdocs-material==9.7.7" "mkdocstrings[python]==1.0.6"

      - name: Build documentation
        run: mkdocs build

      - name: Check the documentation loads nothing off-site
        run: |
          fetched=$(grep -ERoh '<(link|script)[^>]+(href|src)="https?://[^"]+"' build/docs \
            --include='*.html' | grep -Eo 'https?://[^"]+' \
            | grep -v '^https://ssrjkk\.github\.io' | sort -u || true)
          if [ -n "$fetched" ]; then
            echo "::error::Built documentation fetches assets from another host: $fetched"
            exit 1
          fi

      - name: Assemble Pages artifact
        run: |
          rm -rf build/pages
          mkdir -p build/pages
          cp -r site/. build/pages/
          cp -r build/docs build/pages/docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
