name: Type Check
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: python -m mypy --version
      - name: Run mypy
        run: |
          python -m mypy raven/ ravencode/ --ignore-missing-imports 2>&1 | tee mypy_output.txt
      - name: Upload mypy output
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mypy-output-typecheck
          path: mypy_output.txt
          retention-days: 7
  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: |
          for svc in gateway auth monitor-engine; do
            cd services/$svc && go build ./... && cd ../..
          done
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm ci && npx tsc --noEmit
