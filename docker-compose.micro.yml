x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

x-resources: &svc-resources
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: "256M"
      reservations:
        cpus: "0.1"
        memory: "64M"

services:
  traefik:
    image: traefik:v3.1-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
    logging: *default-logging
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    command: ["--config", "/etc/nats/nats.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging: *default-logging
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10-alpine
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    logging: *default-logging
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107-alpine
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otel/config.yml:ro
    command: ["--config", "/etc/otel/config.yml"]
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "128M"
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:2.6-alpine
    ports:
      - "3200:3200"
      - "4317"
      - "4318"
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/tmp/tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1-alpine
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/config.yml"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53-alpine
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "256M"
    logging: *default-logging
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: ./deploy/env/gateway.env
    volumes:
      - gateway_data:/data
    environment:
      - SERVICE_PORT=8000
    healthcheck: *default-healthcheck
    <<: *svc-resources
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      auth:
        condition: service_started

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    env_file: ./deploy/env/auth.env
    volumes:
      - auth_data:/data
    environment:
      - SERVICE_PORT=8001
    healthcheck: *default-healthcheck
    <<: *svc-resources
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy

  agent-core:
    build:
      context: .
      dockerfile: services/agent-core/Dockerfile
    ports:
      - "8002:8002"
    env_file: ./deploy/env/agent-core.env
    volumes:
      - agent_data:/data
    environment:
      - SERVICE_PORT=8002
    healthcheck: *default-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.2"
          memory: "128M"
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      rag-service:
        condition: service_started

  monitor-engine:
    build:
      context: .
      dockerfile: services/monitor-engine/Dockerfile
    ports:
      - "8003:8003"
    env_file: ./deploy/env/monitor-engine.env
    volumes:
      - monitor_data:/data
    environment:
      - SERVICE_PORT=8003
    healthcheck: *default-healthcheck
    <<: *svc-resources
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    ports:
      - "8004:8004"
    env_file: ./deploy/env/rag-service.env
    volumes:
      - rag_data:/data
    environment:
      - SERVICE_PORT=8004
    healthcheck: *default-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.2"
          memory: "256M"
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_started

  task-engine:
    build:
      context: .
      dockerfile: services/task-engine/Dockerfile
    ports:
      - "8005:8005"
    env_file: ./deploy/env/task-engine.env
    volumes:
      - task_data:/data
      - ./deploy/task-policy.yaml:/etc/task-engine/policy.yaml:ro
    environment:
      - SERVICE_PORT=8005
    healthcheck: *default-healthcheck
    <<: *svc-resources
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy

  code-service:
    build:
      context: .
      dockerfile: services/code-service/Dockerfile
    ports:
      - "8006:8006"
    env_file: ./deploy/env/code-service.env
    volumes:
      - code_data:/data
    environment:
      - SERVICE_PORT=8006
    healthcheck: *default-healthcheck
    <<: *svc-resources
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy

volumes:
  nats_data:
  qdrant_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  gateway_data:
  auth_data:
  agent_data:
  monitor_data:
  rag_data:
  task_data:
  code_data:
