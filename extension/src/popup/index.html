<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raven AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">🐦</span>
    <span class="name">Raven AI</span>
    <button id="gear" type="button" class="ghost" aria-label="Connection settings">settings</button>
    <span id="status" class="dot" title="not connected">○</span>
  </header>

  <section id="settings" hidden>
    <label for="endpoint">Gateway</label>
    <input id="endpoint" type="text" placeholder="http://localhost:18888" spellcheck="false" />
    <label for="token">Token</label>
    <input id="token" type="password" placeholder="WEB_SECRET_KEY or a session token" spellcheck="false" />
    <div class="row">
      <button id="save" type="button">Save and connect</button>
      <span id="settings-note" class="note"></span>
    </div>
  </section>

  <main id="messages" aria-live="polite"></main>

  <footer>
    <form id="composer">
      <input id="draft" type="text" placeholder="Message…" autocomplete="off" disabled />
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
