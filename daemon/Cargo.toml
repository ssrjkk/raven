[package]
name = "ravend"
version = "0.1.0"
edition = "2021"
description = "Raven AI — low-level system daemon"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
sysinfo = "0.39"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
axum = "0.8"
nix = { version = "0.31", features = ["signal"] }
