[package]
name = "ravend"
version = "0.1.0"
edition = "2021"
description = "Raven AI — low-level system daemon"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.31"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
axum = "0.7"
nix = { version = "0.29", features = ["signal"] }
