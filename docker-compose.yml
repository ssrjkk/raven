services:
  raven:
    build: .
    ports:
      - "18888:18888"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./workspace:/app/workspace:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18888/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
