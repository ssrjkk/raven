<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ssrjkk" />
    <meta name="description" content="Raven AI — Self-hosted corporate AI assistant. 12 messengers, RAG, monitors, coding tools, RBAC. by ssrjkk" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: http://localhost:18888; font-src 'self' data:" />
    <title>Raven AI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" type="image/vnd.microsoft.icon" />
    <meta name="theme-color" content="#0a0812" />
    <script>
      (function() {
        var theme = null;
        try { var s = localStorage.getItem('raven-theme'); if (s === 'light' || s === 'dark' || s === 'midnight') theme = s; }
        catch(e) {}
        if (theme === null) {
          theme = 'dark';
          try { if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'; }
          catch(e) {}
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) { meta.setAttribute('content', theme === 'midnight' ? '#06040c' : theme === 'light' ? '#f4f2fa' : '#0a0812'); }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raven AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
